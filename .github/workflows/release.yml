name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment
        uses: ./.github/actions/setup
      - name: Check source policy and tests
        run: npm run check:custom-sources && npm run test:custom-sources && npm run lint
      - name: Build all Android APKs
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease
      - name: Verify APKs
        run: python3 scripts/check-apk-sources.py
      - name: Read version and checksums
        run: |
          echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          cd android/app/build/outputs/apk/release
          sha256sum lx-music-mobile-v*.apk > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: 洛雪增强版 v${{ env.PACKAGE_VERSION }}
          body_path: publish/changeLog.md
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
